name: Release binaries and GHCR image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  # Supersede an in-flight run for the same tag. With this disabled, re-pushing
  # a tag queues the new run behind the old one instead of replacing it, so a
  # single stalled job blocks every later release attempt for that ref.
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      image_name: ${{ steps.metadata.outputs.image_name }}
    steps:
      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a semantic version such as v1.0.0 or v1.0.0-rc.1" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  # Each target builds on a runner that natively executes its own architecture.
  # Cross-compiling is avoided on purpose: an emulated arm64 build is slow, and a
  # native build also proves the binary actually starts on that platform.
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            archive: tar.gz
            extension: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            extension: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            archive: zip
            extension: .exe
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            archive: zip
            extension: .exe
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            archive: tar.gz
            extension: ""
          - goos: darwin
            goarch: amd64
            # Go cross-compiles from any host, and unlike the arm64 targets this
            # pair gains nothing from a native runner: macOS arm64 runners are
            # plentiful while Intel runners are frequently queued for a long
            # time, which would block the whole release. Only a smoke test is
            # skipped for this row, since the binary cannot run on the host.
            runner: macos-latest
            archive: tar.gz
            extension: ""
            cross: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve package name
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          echo "package_name=opencode2api_${RELEASE_TAG}_${{ matrix.goos }}_${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"

      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          GOOS: ${{ matrix.goos }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          package_dir="dist/$PACKAGE_NAME"
          mkdir -p "$package_dir"
          # GOOS and GOARCH are both set explicitly so the artifact always
          # matches the label, independently of the runner it was built on.
          GOOS="$GOOS" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" \
            -o "$package_dir/opencode2api$EXTENSION" ./cmd/opencode2api

          # Ship a ready-to-edit config.json so the archive works without a copy
          # step. It only ever holds the placeholders from config.example.json,
          # and config.json itself stays git-ignored. No launcher script is
          # bundled: a batch file would need a specific code page to stay
          # readable, so users run the binary directly instead.
          cp config.example.json "$package_dir/config.json"

          cp README.md README.zh-CN.md DEPLOYMENT.md "$package_dir/"

          if [ "$EXTENSION" != ".exe" ]; then
            chmod +x "$package_dir/opencode2api"
          fi

          if [ "$ARCHIVE_FORMAT" = "zip" ]; then
            # zip and sha256sum are absent on the Windows runners, so the
            # archive is produced by PowerShell and hashed with Get-FileHash.
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$PACKAGE_NAME' -DestinationPath 'dist/$PACKAGE_NAME.zip' -Force"
            archive="$PACKAGE_NAME.zip"
          else
            tar -C dist -czf "dist/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
            archive="$PACKAGE_NAME.tar.gz"
          fi

          if [ "$GOOS" = "windows" ]; then
            digest="$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 'dist/$archive').Hash.ToLower()")"
            printf '%s  %s\n' "$digest" "$archive" > "dist/$archive.sha256"
          else
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          fi

      - name: Smoke test the packaged archive
        shell: bash
        run: |
          package_dir="dist/${{ steps.metadata.outputs.package_name }}"
          # The documented first step is "edit config.json", so the archive must
          # contain one and it must parse.
          test -f "$package_dir/config.json"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell -NoProfile -Command "Get-Content -Raw '$package_dir/config.json' | ConvertFrom-Json | Out-Null"
          else
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$package_dir/config.json"
          fi
          # Running the binary only makes sense when it was built for this host;
          # a cross-compiled one would report an exec format error.
          if [ "${{ matrix.cross }}" != "true" ]; then
            "$package_dir/opencode2api${{ matrix.extension }}" -h 2>&1 | head -5
          else
            file "$package_dir/opencode2api" | head -1
          fi
          ls -1 "$package_dir"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.package_name }}
          path: |
            dist/${{ steps.metadata.outputs.package_name }}.${{ matrix.archive }}
            dist/${{ steps.metadata.outputs.package_name }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  container:
    name: Publish GHCR image
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          # The image is the only place that still needs emulation; the release
          # binaries above are all built natively.
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: image_metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.release_tag }}
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.release_tag }},enable=${{ !contains(needs.prepare.outputs.release_tag, '-') }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.release_tag }},enable=${{ !contains(needs.prepare.outputs.release_tag, '-') }}
          labels: |
            org.opencontainers.image.title=opencode2api
            org.opencontainers.image.description=OpenAI-compatible API gateway for OpenCode Zen and Go

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_metadata.outputs.tags }}
          labels: ${{ steps.image_metadata.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.release_tag }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub Release
    needs: [prepare, build, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: opencode2api_*
          path: release-files
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          release_type=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_type+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-files/* "${release_type[@]}" --generate-notes --title "$RELEASE_TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
