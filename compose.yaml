services:
  opencode2api:
    image: ghcr.io/wu-jiyan/opencode2api:${OPENCODE2API_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_PATH: /var/lib/opencode2api/config.json
      CONFIG_SEED_PATH: /run/config/opencode2api.json
      # Empty defers to the listen addresses in config.json. Export
      # OPENCODE2API_LISTEN / OPENCODE2API_WEBUI_LISTEN to override them.
      LISTEN_ADDRESS: ${OPENCODE2API_LISTEN:-}
      WEBUI_LISTEN_ADDRESS: ${OPENCODE2API_WEBUI_LISTEN:-}
    ports:
      - "${OPENCODE2API_PORT:-8080}:8080"
      - "${OPENCODE2API_WEBUI_PORT:-8081}:8081"
    configs:
      - source: opencode2api_config
        target: /run/config/opencode2api.json
    volumes:
      # The state volume also holds the automatically downloaded Xray
      # (/var/lib/opencode2api/bin/xray), so vless works without mounting
      # anything. Set vless.auto_download_xray to false when you mount your own
      # Xray below instead.
      - opencode2api-state:/var/lib/opencode2api
      # - /host/path/to/xray:/app/bin/xray/xray:ro
    tmpfs:
      - /tmp

configs:
  opencode2api_config:
    file: ./config.json

volumes:
  opencode2api-state:
